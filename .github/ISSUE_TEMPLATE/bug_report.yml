name: Bug report
description: Report a reproducible software or numerical issue.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Do not include secrets, private paths, or large run artifacts.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and claim impact
