name: Static validation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  inexpensive-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Static package validation
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/static_validate.py --root .
      - name: Externally pinned VAL-001 candidate root
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          EXPECTED_TREE="$(git rev-parse "${EXPECTED_HEAD}^{tree}")"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_val001_administrative_closure.py \
            --root . --expected-head "$EXPECTED_HEAD" --expected-tree "$EXPECTED_TREE"
      - name: Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Historical baseline integrity
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_v0_1_4_baseline_integrity.py --root . --output /tmp/v0-1-4-baseline.json
      - name: Active governing-change boundary
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_governing_physics_change.py --root . --output /tmp/governing-change.json
      - name: Release-finalization boundary
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_change_contract.py --root . --output /tmp/change-contract.json
      - name: Historical release integrity
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_release_finalization.py --root . --output /tmp/release-integrity.json
      - name: WP-0.3A evidence-review boundary
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_wp03_evidence_review.py --root . --output /tmp/wp03-evidence-review.json
      - name: WP-0.3B non-protected verification boundary
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_wp03b_nonprotected_verification.py --root . --output /tmp/wp03b-boundary.json
      - name: WP-0.3B A1/P1 amended canonical result required for merge
        run: test -f validation/results/WP_0_3B_A1_NONPROTECTED_EXTRACTION_VERIFICATION_RESULT.json
      - name: WP-0.3C Stage-0 scaffold boundary
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_wp03c_stage0_scaffold.py --root . --output /tmp/wp03c-stage0.json
      - name: Shell syntax
        run: |
          find . -type f \( -name '*.sh' -o -name 'Allrun' -o -name 'Allverify' -o -name 'Allclean' -o -name 'Allwmake' \) -print0 |
            xargs -0 -n1 bash -n
      - name: JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          PY
