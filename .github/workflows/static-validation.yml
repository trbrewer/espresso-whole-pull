name: Static validation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  inexpensive-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Static package validation
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/static_validate.py --root .
      - name: Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Historical baseline integrity
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_v0_1_4_baseline_integrity.py --root . --output /tmp/v0-1-4-baseline.json
      - name: Active governing-change boundary
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_governing_physics_change.py --root . --output /tmp/governing-change.json
      - name: Release-finalization boundary
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_change_contract.py --root . --output /tmp/change-contract.json
      - name: Shell syntax
        run: |
          find . -type f \( -name '*.sh' -o -name 'Allrun' -o -name 'Allverify' -o -name 'Allclean' -o -name 'Allwmake' \) -print0 |
            xargs -0 -n1 bash -n
      - name: JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          PY
