<svg xmlns="http://www.w3.org/2000/svg" width="900" height="182" role="img"><title>Apparent conductance requirement</title><rect width="100%" height="100%" fill="white"/><text x="30" y="35" font-family="sans-serif" font-size="22" font-weight="bold">Apparent conductance requirement</text><text x="30" y="70" font-family="sans-serif" font-size="15">C11/C5 = 0.373506</text><text x="30" y="94" font-family="sans-serif" font-size="15">K proportional to p^-n: terminal 5-to-11 n = 1.174</text><text x="30" y="118" font-family="sans-serif" font-size="15">Density changes absolute scale, not ordering or conductance ratios.</text></svg>
